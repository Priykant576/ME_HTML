<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <fieldset>
<legend>Biodata</legend>

<form action="#">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" placeholder="enter your name">
    <br><br>
    <label for="pass">Password:</label>
    <input type="password" name="pass" id="pass">
    <br><br>
    <label for="tel">Phone:</label>
    <input type="tel" name="tel" id="tel">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email" placeholder="enter your email">
    <br><br>
    <label for="dob">Date of Birth:</label>
    <input type="date" name="dob" id="dob">
    <br><br>
    <label for="add">Address:</label>
    <textarea name="add" id="add"></textarea>
<br><br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    <br><br>
    <label for="hobb">Hobbies:</label>
    <input type="checkbox" name="hobb1" id="hobb1" value="cricket">
    <label for="hobb1">Cricket</label>
    <input type="checkbox" name="hobb2" id="hobb2" value="football">
    <label for="hobb2">Football</label>
    <br><br>
    <label for="lang">Select any one programming Language:</label>

    <select name="lang" id="lang">
        <option value="C">C</option>
        <option value="C++">C++</option>
        <option value="java">java</option>
        <option value="python">Python</option>
</form>
    </fieldset>
</body>
</html>
